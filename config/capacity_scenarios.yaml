# Capacity-test agent scenarios — six REAL agent flows for capacity planning.
# A "virtual user" is one of these blocks looping continuously; the ramp adds
# users until the system saturates.
#
# Every scenario is a genuine agent loop (no chatbot pings): tools are called
# and their results injected into context, later steps re-read what earlier
# steps produced, and sessions compound across turns where the real workflow
# is conversational. That growing-prefill / resident-KV behavior is what makes
# agent capacity different from chat capacity — and is what this test measures.
#
# Step fields:
#   carry_context: true   prompt includes everything accumulated this turn
#   tool_calls: N         N tool round-trips: the virtual session waits out
#                         tool_latency_ms, injects tool_result_tokens into
#                         context, and calls again — every tool call is an extra
#                         LLM continuation. (Whether the engine retains KV/prefix
#                         state across the wait is engine policy; the measured
#                         KV gauge is the source of truth, not this simulation.)
# Scenario fields:
#   session_turns: K      context compounds across K loops (a user session or
#                         ticket conversation), then resets; context_cap bounds it

# The reference tile — one "Agent Capacity Unit" (ACU). Capacity ramps add one
# COMPLETE tile at a time so every rung has the same workload mix and adjacent
# rungs are comparable (the VMmark tile idea). Weighted toward support because
# that's the dominant real-world deployment. Custom mixes remain available for
# customer-specific planning but are marked non-comparable.
tile:
  support_agent: 2
  doc_intelligence: 1
  code_agent: 1
  research_agent: 1
  ops_analyst: 1
  deep_agent: 1

# Bump when scenario/tile semantics change — part of every result's repro block.
version: 14

scenarios:
  support_agent:
    name: "Customer support agent"
    blurb: "Pulls the customer record and KB articles, then answers within a running ticket conversation that compounds over 4 turns."
    complexity: light
    think_ms: 1500
    session_turns: 4
    context_cap: 5000
    steps:
      - {label: "triage+lookup", prompt_tokens: 250, max_tokens: 150,
         tool_calls: 2, tool_result_tokens: 500, tool_latency_ms: 350}
      - {label: "respond", prompt_tokens: 150, max_tokens: 300, carry_context: true}

  doc_intelligence:
    name: "Document intelligence"
    blurb: "Retrieves two large document chunks, extracts the key data over them, then composes a structured summary — data-inclusion prefill at its heaviest."
    complexity: medium
    think_ms: 1500
    session_turns: 1
    context_cap: 8000
    steps:
      - {label: "ingest", prompt_tokens: 300, max_tokens: 200,
         tool_calls: 2, tool_result_tokens: 1500, tool_latency_ms: 400}
      - {label: "extract", prompt_tokens: 200, max_tokens: 300, carry_context: true}
      - {label: "summarize", prompt_tokens: 200, max_tokens: 300, carry_context: true}

  code_agent:
    name: "Coding agent (fix loop)"
    blurb: "Writes code, runs the tests in a sandbox, fixes with the failure output in context, re-runs to verify — the classic agentic fix loop over a 2-turn session."
    complexity: medium
    think_ms: 1200
    session_turns: 2
    context_cap: 6000
    steps:
      - {label: "implement", prompt_tokens: 400, max_tokens: 500}
      - {label: "test+fix", prompt_tokens: 150, max_tokens: 300,
         carry_context: true, tool_calls: 1, tool_result_tokens: 250, tool_latency_ms: 700}
      - {label: "verify", prompt_tokens: 100, max_tokens: 150,
         carry_context: true, tool_calls: 1, tool_result_tokens: 150, tool_latency_ms: 700}

  research_agent:
    name: "Research agent"
    blurb: "Two web searches injected into context, analysis over the findings, then a brief written over everything gathered — compounding context each step."
    complexity: medium
    think_ms: 1500
    session_turns: 2
    context_cap: 6000
    steps:
      - {label: "gather", prompt_tokens: 300, max_tokens: 350,
         tool_calls: 2, tool_result_tokens: 600, tool_latency_ms: 500}
      - {label: "analyze", prompt_tokens: 300, max_tokens: 300, carry_context: true}
      - {label: "write", prompt_tokens: 250, max_tokens: 400, carry_context: true}

  ops_analyst:
    name: "Ops / BI analyst agent"
    blurb: "Runs two database queries, interprets the result sets in context, and writes the digest — the scheduled monitoring agent pattern."
    complexity: medium
    think_ms: 2000
    session_turns: 1
    context_cap: 6000
    steps:
      - {label: "query", prompt_tokens: 350, max_tokens: 200,
         tool_calls: 2, tool_result_tokens: 800, tool_latency_ms: 600}
      - {label: "interpret", prompt_tokens: 200, max_tokens: 300, carry_context: true}
      - {label: "report", prompt_tokens: 150, max_tokens: 350, carry_context: true}

  deep_agent:
    name: "Deep multi-agent pipeline"
    blurb: "Plan, three tool-using workers, synthesis over all results — the full orchestration pattern, session compounding over 3 turns."
    complexity: heavy
    think_ms: 2000
    session_turns: 3
    context_cap: 6000
    steps:
      - {label: "plan", prompt_tokens: 500, max_tokens: 250}
      - {label: "worker-1", prompt_tokens: 300, max_tokens: 300,
         carry_context: true, tool_calls: 1, tool_result_tokens: 300, tool_latency_ms: 400}
      - {label: "worker-2", prompt_tokens: 300, max_tokens: 300,
         carry_context: true, tool_calls: 1, tool_result_tokens: 300, tool_latency_ms: 400}
      - {label: "worker-3", prompt_tokens: 300, max_tokens: 300,
         carry_context: true, tool_calls: 1, tool_result_tokens: 300, tool_latency_ms: 400}
      - {label: "synthesize", prompt_tokens: 400, max_tokens: 450, carry_context: true}

# ── End-to-end agent-runtime mode ─────────────────────────────────────────────
# These are REAL workflows submitted through the orchestrator (planner, workers,
# validation, synthesis) — the truth test behind the synthetic traces. Lower
# scale by nature: one "call" = one complete workflow. Determinism comes from
# the router the app is configured with (mock router => fully deterministic).
e2e_tile:
  research_brief: 1
  comparison: 1
  digest: 1

# AGENT DEADLINE TIERS. The weigh-in measures a machine's median workflow
# time at one tile, that median places it in a tier, and the tier's deadline
# is what its agents are held to. Six tiers span every agent host we expect
# to test; the last has no ceiling, so no system is ever excluded.
#
# Each tier's deadline is ~3x its median ceiling: a machine at the top of its
# tier may degrade 3x under load before missing, and a slower machine gets
# proportionately more time because slower work is work someone is waiting on
# less urgently. Tier names describe the USE CASE the deadline serves.
#
# CHARACTERIZATION PHASE: these boundaries are a reasoned starting point, not
# settled categories. dellr470 is the anchor system (see repro provenance);
# boundaries will be revised in a later workload version once several servers
# have been characterized, with the anchor lineage recorded.
service_tiers:
  - {name: conversational, max_median_s: 5,   deadline_s: 15}    # answer in-line
  - {name: interactive,    max_median_s: 15,  deadline_s: 45}    # a person waiting
  - {name: responsive,     max_median_s: 50,  deadline_s: 150}   # a person nearby
  - {name: attended,       max_median_s: 150, deadline_s: 450}   # checked on
  - {name: queued,         max_median_s: 400, deadline_s: 1200}  # submitted, not watched
  - {name: background,                        deadline_s: 3600}  # catch-all, no ceiling

# Weigh-in protocol (frozen with the workload): median of `samples_per_type`
# completions per workflow type at one tile. The WORST type's median places
# the machine — one fast workflow must not carry a slow one into a deadline
# it cannot meet. Expiry of max_s means too few completions landed to measure
# the machine at all, which is an evidence statement, not an exclusion.
weigh_in:
  samples_per_type: 4
  max_s: 1800

# Open-loop offered-rate ramp (workflows per second), used by the capacity test.
arrival_schedule:
  start_rate: 2.0
  step_factor: 1.4        # geometric while the backlog stays flat
  max_rate: 4000.0
  hold_s: 45              # dwell per rate level, evaluated for backlog growth
  max_backlog: 20000      # bounded queue: past this the generator records a rejection

# End-to-end workflows are FIXED-SIZE, SELF-CONTAINED work units. All source
# material rides inside the prompt — no web research, no external tools — so a
# workflow's size cannot depend on tool availability or the model's appetite,
# and results are attributable to the inference + orchestration under test.
# Budgets are part of the workload definition (and the scenario fingerprint):
# a workflow that hits its budget did NOT complete the unit and counts as a
# failure, exactly like a timeout. think_ms is the MEAN think time: each
# session applies seeded +/-25% jitter so ramp batches cannot phase-lock into
# workload pulses (part of the workload definition; deterministic per seed).
#
# The service ladder declares the CAPABILITY rungs. Each rung is a USE CASE
# with the deadline that use case tolerates — a fact about the work and the
# person or pipeline waiting on it, never about any machine. Rungs are frozen
# with this workload version. A weigh-in before the ramp measures each type's
# median latency at one tile and assigns the TIGHTEST rung the host is
# eligible for (worst-type median <= margin x rung deadline). A host whose
# weigh-in fits no rung is UNCLASSIFIABLE for this workload, which is a
# publishable verdict, not an error. Capability is then the largest session
# level where every workflow type meets the assigned rung's deadline at the
# joint confidence target, and every other rung is reported as an observed
# overlay from the same data. Class and number are inseparable in reporting.
#
# arrival_schedule drives the open-loop CAPACITY test. Offered rate is global;
# the mix of types at any rate follows the same tile rotation the capability
# test uses, so the two metrics measure the same workload.
#
# contract / contract_live declare the shape a COMPLETED unit must have. The
# deterministic mock planner produces exactly 3 subtasks, 3 steps, 10 model
# calls and 7 validations, so contract holds it to that; contract_live gives a
# real planner the range its guardrails allow. A unit outside its contract is
# workload-invalid: it counts as neither a success nor a capacity failure, and
# enough of them invalidate the run.
e2e_workflows:
  research_brief:
    name: "Research brief (e2e)"
    think_ms: 3000
    toolless: true                       # no catalog/builtin tools; bench_record only
    tools: [bench_record]                # 1 real record-keeping call per worker
    contract: {task_count: [3, 3], steps: [3, 3], llm_calls: [10, 10], validations: [7, 7], tool_calls: [3, 3]}
    contract_live: {task_count: [1, 5], steps: [1, 5], llm_calls: [4, 60], validations: [0, 40], tool_calls: [0, 10]}  # calibration 2026-08-27: healthy units 12-34 calls, 2-8 tools; bounds sit inside the budget lines so budgets fail runaways first
    budgets: {max_subagents: 4, max_tool_hops: 2}  # PER-AGENT semantics: hop budget binds each worker (intent: 1 call + 1 slack), subagent budget binds the plan (intent: 3 + 1 slack); the guards replan/clamp at these lines so a unit can never balloon past its declared size
    query: >-
      Using ONLY the field notes below (do not research further), write a
      one-page brief on CPU-only LLM inference with a clear recommendation.
      Field notes: (1) llama.cpp with 4-bit GGUF quantization reached 12
      tokens/sec for a 30B model on a 64-core Xeon, with prompt processing at
      95 tokens/sec; memory use was 21 GB. (2) SGLang's CPU backend with AMX
      and FP8 weights reached 19 tokens/sec decode and 210 tokens/sec prefill
      on the same class of machine at 26 GB resident, but requires AVX-512/AMX
      capable PyTorch builds. (3) vLLM's CPU mode is maintained primarily for
      development parity; published numbers show roughly half of SGLang's CPU
      throughput on identical hardware. (4) All three engines saturate memory
      bandwidth before compute at batch sizes above 8. Plan EXACTLY three worker subtasks and no more: research, analysis, and writing. Each worker calls bench_record exactly once, then writes its section and stops. Deliverable: a brief
      with sections for findings, trade-offs, and one recommendation.
  comparison:
    name: "Comparison analysis (e2e)"
    think_ms: 3000
    toolless: true                       # no catalog/builtin tools; bench_record only
    tools: [bench_record]                # 1 real record-keeping call per worker
    contract: {task_count: [3, 3], steps: [3, 3], llm_calls: [10, 10], validations: [7, 7], tool_calls: [3, 3]}
    contract_live: {task_count: [1, 5], steps: [1, 5], llm_calls: [4, 60], validations: [0, 40], tool_calls: [0, 10]}  # calibration 2026-08-27: healthy units 12-34 calls, 2-8 tools; bounds sit inside the budget lines so budgets fail runaways first
    budgets: {max_subagents: 4, max_tool_hops: 2}  # PER-AGENT semantics: hop budget binds each worker (intent: 1 call + 1 slack), subagent budget binds the plan (intent: 3 + 1 slack); the guards replan/clamp at these lines so a unit can never balloon past its declared size
    query: >-
      Using ONLY the measurements below (do not research further), compare
      INT8, INT4, and FP8 quantization for a 30B-parameter model and recommend
      one for deployment. Measurements: INT8 — 30 GB weights, 0.3% average
      accuracy loss on evaluation suites, broad kernel support. INT4 — 16 GB
      weights, 1.8% accuracy loss that concentrates in math and code tasks,
      fastest decode on memory-bound hosts. FP8 — 31 GB weights, 0.1% accuracy
      loss, requires recent hardware support (AMX/FP8 kernels), prefill
      throughput 15% higher than INT8 in vendor tests. Plan EXACTLY three worker subtasks and no more: research, analysis, and writing. Each worker calls bench_record exactly once, then writes its section and stops. Deliverable: a
      comparison table, a paragraph on the trade-offs, and one deployment
      recommendation with its main risk.
  digest:
    name: "Digest report (e2e)"
    think_ms: 3000
    toolless: true                       # no catalog/builtin tools; bench_record only
    tools: [bench_record]                # 1 real record-keeping call per worker
    contract: {task_count: [3, 3], steps: [3, 3], llm_calls: [10, 10], validations: [7, 7], tool_calls: [3, 3]}
    contract_live: {task_count: [1, 5], steps: [1, 5], llm_calls: [4, 60], validations: [0, 40], tool_calls: [0, 10]}  # calibration 2026-08-27: healthy units 12-34 calls, 2-8 tools; bounds sit inside the budget lines so budgets fail runaways first
    budgets: {max_subagents: 4, max_tool_hops: 2}  # PER-AGENT semantics: hop budget binds each worker (intent: 1 call + 1 slack), subagent budget binds the plan (intent: 3 + 1 slack); the guards replan/clamp at these lines so a unit can never balloon past its declared size
    query: >-
      Using ONLY the four items below (do not research further), compile a
      digest in exactly five bullet points, ordered by operational impact.
      Items: (1) An open-source serving stack added disaggregated prefill,
      letting prefill and decode scale on separate node pools. (2) A major
      inference engine released speculative-decoding support that reports
      1.9x decode speedup on 70B models with a 1B draft model. (3) A widely
      used gateway added semantic caching with embedding-similarity hits,
      claiming 30% token savings on support workloads. (4) Two engines
      standardized on an OpenAI-compatible batch API for offline jobs.
      Plan EXACTLY three worker subtasks and no more, never one per item:
      research (extract the key facts from ALL FOUR items), analysis (rank
      all four by operational impact), and writing (compose the digest).
      Each worker calls bench_record exactly once, then writes its section
      and stops. Deliverable: five bullets, each naming the item it
      summarizes and one sentence on who is affected.
