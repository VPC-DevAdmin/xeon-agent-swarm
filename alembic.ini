# Alembic configuration for the orchestration platform.
# The actual database URL is injected from DATABASE_URL at runtime by env.py,
# so the sqlalchemy.url below is only a placeholder for offline tooling.

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
path_separator = os
# Placeholder — env.py overrides this from the DATABASE_URL env var.
sqlalchemy.url = postgresql+asyncpg://swarm:swarm@localhost:5432/swarm

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
