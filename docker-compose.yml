services:

  # ── Redis Stack (key-value + pubsub for queues, schedules, and live state) ──
  # Used by backend.queue.task_queue (run results cache + websocket pubsub).
  # RediSearch/RedisJSON modules remain available for future use but no
  # corpus or vector index is kept in this project anymore — semantic search
  # is delegated to SEMANTIC_SEARCH_ENDPOINT (sibling project).
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6479:6379"
      - "8001:8001"   # RedisInsight UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MCP servers ───────────────────────────────────────────────────────────

  # Web search via Brave (falls back to DuckDuckGo if BRAVE_API_KEY unset).
  mcp-web-search:
    build: ./mcp_servers/web_search
    ports: ["9401:9001"]
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}

  # Doc retrieval = thin MCP proxy to the external semantic search service.
  # See mcp_servers/doc_retrieval/server.py and docs/standards.md.
  mcp-doc-retrieval:
    build: ./mcp_servers/doc_retrieval
    ports: ["9402:9002"]
    environment:
      - SEMANTIC_SEARCH_ENDPOINT=${SEMANTIC_SEARCH_ENDPOINT:-}
      - SEMANTIC_SEARCH_TOKEN=${SEMANTIC_SEARCH_TOKEN:-}
      - SEMANTIC_SEARCH_TIMEOUT=${SEMANTIC_SEARCH_TIMEOUT:-20}

  # Code execution sandbox.
  mcp-code-exec:
    build: ./mcp_servers/code_exec
    ports: ["9403:9003"]

  # ── Backend ───────────────────────────────────────────────────────────────
  # Pure orchestration. Calls the external LLM router for inference and the
  # external semantic search service (via mcp-doc-retrieval) for grounded
  # context. Stores no model weights and no corpus content.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # ── LLM router ───────────────────────────────────────────────────────
      # See docs/router-contract.md for the wire format and specialty names.
      - LLM_TIER_ENDPOINT=${LLM_TIER_ENDPOINT:-}
      - LLM_TIER_TOKEN=${LLM_TIER_TOKEN:-}
      # Per-role specialty model names (router specialty contract).
      - ORCHESTRATOR_MODEL=${ORCHESTRATOR_MODEL:-orchestrator-v2.1}
      - VALIDATOR_MODEL=${VALIDATOR_MODEL:-validator-v1.0}
      - WORKER_DEFAULT_MODEL=${WORKER_DEFAULT_MODEL:-worker-default-v1.0}
      - REDUCER_MODEL=${REDUCER_MODEL:-worker-default-v1.0}

      # ── Client-side rate limiting on the shared router ────────────────────
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-8}
      - INFERENCE_MAX_RETRIES=${INFERENCE_MAX_RETRIES:-3}

      # ── Vision worker (optional separate VLM endpoint) ───────────────────
      - VLM_ENDPOINT=${VLM_ENDPOINT:-}
      - VLM_MODEL=${VLM_MODEL:-worker-vision-v1.0}

      # ── Knowledge retrieval (proxied through mcp-doc-retrieval) ──────────
      # The endpoint values below are used by the MCP server itself; the
      # backend just reaches it via MCP_DOC_RETRIEVAL_URL.
      - REDIS_URL=redis://redis:6379

      # ── MCP servers ──────────────────────────────────────────────────────
      - MCP_WEB_SEARCH_URL=http://mcp-web-search:9001
      - MCP_DOC_RETRIEVAL_URL=http://mcp-doc-retrieval:9002
      - MCP_CODE_EXEC_URL=http://mcp-code-exec:9003

      # ── File paths (audio output) ────────────────────────────────────────
      - AUDIO_DIR=/data/audio
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - audio_data:/data/audio
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  redis_data:
  audio_data:
