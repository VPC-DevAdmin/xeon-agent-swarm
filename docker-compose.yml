services:

  # Persistence is a single SQLite file under the orchestrator_data volume
  # (backend service below) — no database server. See backend/db/models.py.

  # ── MCP servers ───────────────────────────────────────────────────────────

  # Web search via Brave (falls back to DuckDuckGo if BRAVE_API_KEY unset).
  mcp-web-search:
    build: ./mcp_servers/web_search
    ports: ["9401:9001"]
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}

  # Doc retrieval = thin MCP proxy to the external semantic search service.
  # See mcp_servers/doc_retrieval/server.py and docs/standards.md.
  #
  # The search service runs on the HOST at 127.0.0.1:8080. From inside this
  # container, reach the host via host.docker.internal (mapped below to the
  # docker bridge gateway so it works on Linux too).
  mcp-doc-retrieval:
    build: ./mcp_servers/doc_retrieval
    ports: ["9402:9002"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SEMANTIC_SEARCH_ENDPOINT=${SEMANTIC_SEARCH_ENDPOINT:-http://host.docker.internal:8080}
      - SEMANTIC_SEARCH_QUERY_PATH=${SEMANTIC_SEARCH_QUERY_PATH:-/query}
      - SEMANTIC_SEARCH_TOKEN=${SEMANTIC_SEARCH_TOKEN:-}
      - SEMANTIC_SEARCH_TIMEOUT=${SEMANTIC_SEARCH_TIMEOUT:-30}

  # Code execution sandbox.
  mcp-code-exec:
    build: ./mcp_servers/code_exec
    ports: ["9403:9003"]

  # ── Backend ───────────────────────────────────────────────────────────────
  # Pure orchestration. Calls the external LLM router for inference and the
  # external semantic search service (via mcp-doc-retrieval) for grounded
  # context. Stores no model weights and no corpus content.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # ── LLM router ───────────────────────────────────────────────────────
      # See docs/router-contract.md for the wire format and specialty names.
      - LLM_TIER_ENDPOINT=${LLM_TIER_ENDPOINT:-}
      - LLM_TIER_TOKEN=${LLM_TIER_TOKEN:-}
      # Per-role specialty model names (router specialty contract).
      - ORCHESTRATOR_MODEL=${ORCHESTRATOR_MODEL:-orchestrator-v2.1}
      - VALIDATOR_MODEL=${VALIDATOR_MODEL:-validator-v1.0}
      - WORKER_DEFAULT_MODEL=${WORKER_DEFAULT_MODEL:-worker-default-v1.0}
      - REDUCER_MODEL=${REDUCER_MODEL:-worker-default-v1.0}

      # ── Client-side rate limiting on the shared router ────────────────────
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-8}
      - INFERENCE_MAX_RETRIES=${INFERENCE_MAX_RETRIES:-3}

      # ── Vision worker (optional separate VLM endpoint) ───────────────────
      - VLM_ENDPOINT=${VLM_ENDPOINT:-}
      - VLM_MODEL=${VLM_MODEL:-worker-vision-v1.0}

      # ── Persistence (SQLite — single file under the orchestrator_data vol) ─
      - DATABASE_URL=sqlite+aiosqlite:////data/db/orchestrator.db
      # Fernet key for connector-secret encryption. MUST be set to create
      # connectors that carry secrets.
      # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-}

      # ── MCP servers ──────────────────────────────────────────────────────
      - MCP_WEB_SEARCH_URL=http://mcp-web-search:9001
      - MCP_DOC_RETRIEVAL_URL=http://mcp-doc-retrieval:9002
      - MCP_CODE_EXEC_URL=http://mcp-code-exec:9003

      # ── File paths (audio output) ────────────────────────────────────────
      - AUDIO_DIR=/data/audio
    volumes:
      - ./config:/app/config:ro
      - audio_data:/data/audio
      - orchestrator_data:/data/db
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  orchestrator_data:
  audio_data:
