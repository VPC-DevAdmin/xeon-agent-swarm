# Merged ingress for the `router-origin` tunnel — one tunnel, three hostnames.
#
# Install to /etc/cloudflared/config.yml (the path `cloudflared service install`
# uses), NOT the per-repo path the tunnel was started from by hand. See
# docs/deployment.md.
#
# ORDER MATTERS: first match wins, and the catch-all must stay last.

tunnel: f3f00468-5489-466d-b5e0-a7d65c855bfa
credentials-file: /etc/cloudflared/f3f00468-5489-466d-b5e0-a7d65c855bfa.json

# Keep connections alive for the agent demo's WebSocket event stream: a run can
# sit quiet between agent steps, and the default idle timeout would cut it.
originRequest:
  connectTimeout: 30s
  noTLSVerify: false

ingress:
  # Front door — the hub page that lists the demos (scripts/hub_server.py).
  - hostname: livedemos.enterpriseai.center
    service: http://localhost:8088

  # Agent Orchestrator demo — single-origin (UI + REST + WebSocket on one port).
  - hostname: agents.enterpriseai.center
    service: http://localhost:8010

  # Capacity Planner demo — SAME app/process (the e2e benchmark drives the
  # orchestrator in-process); the SPA fronts the planner on this hostname.
  - hostname: capacity.enterpriseai.center
    service: http://localhost:8010

  # Existing: the semantic tier router gateway (unchanged).
  - hostname: router-origin.enterpriseai.center
    service: http://localhost:8900

  - service: http_status:404
