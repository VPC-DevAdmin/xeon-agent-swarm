<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E141F;--panel:#131A26;--elev:#19222F;--line:#26313F;--line-soft:#1D2531;
  --text:#E9EDF4;--muted:#8A94A8;--faint:#596273;--accent:#7C87F5;--ok:#57C98A;
  --shadow:0 12px 34px -20px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;padding:0 20px}
header{width:100%;max-width:880px;padding:64px 0 28px}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px rgba(124,135,245,.16)}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--faint)}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:34px;
  letter-spacing:-.025em;margin:0 0 8px}
.sub{color:var(--muted);font-size:15px;max-width:560px;margin:0}
main{width:100%;max-width:880px;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));padding-bottom:48px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);
  transition:border-color .18s,transform .18s}
.card:hover{border-color:#39445c;transform:translateY(-2px)}
.card .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.card h2{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:17px;margin:0;flex:1}
.status{display:flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;color:var(--faint);white-space:nowrap}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sdot.up{background:var(--ok);box-shadow:0 0 0 3px rgba(87,201,138,.15)}
.sdot.down{background:#E56A82}
.sdot.checking{background:var(--faint);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.blurb{color:var(--muted);font-size:13.5px;margin:0 0 14px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tag{font-family:"JetBrains Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:6px;
  background:var(--elev);border:1px solid var(--line);color:var(--muted)}
.open{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--accent)}
.card:hover .open .arrow{transform:translateX(3px)}
.arrow{transition:transform .18s}
footer{width:100%;max-width:880px;padding:0 0 48px;color:var(--faint);font-size:12px;
  border-top:1px solid var(--line-soft);padding-top:18px}
.empty{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:14px;
  grid-column:1/-1;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <header>
    <div class="brandrow"><span class="dot"></span><span class="eyebrow" id="eyebrow">Xeon server</span></div>
    <h1 id="title">Demos</h1>
    <p class="sub" id="subtitle"></p>
  </header>
  <main id="grid"></main>
  <footer id="footer"></footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function checkUp(demo) {
  // Cross-origin liveness: no-cors resolves (opaque) when reachable, rejects on
  // network failure. We only need up/down, not the body.
  const url = demo.url.replace(/\/+$/, '') + (demo.health || '/health');
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 4000);
  try {
    await fetch(url, { mode: 'no-cors', signal: ctl.signal, cache: 'no-store' });
    return true;
  } catch { return false; }
  finally { clearTimeout(t); }
}

function card(d) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = d.url;
  a.style.borderTopColor = d.accent || 'var(--line)';
  a.innerHTML = `
    <div class="top">
      <h2>${esc(d.name)}</h2>
      <span class="status"><span class="sdot checking" id="s-${esc(d.id)}"></span>
        <span id="t-${esc(d.id)}">checking</span></span>
    </div>
    <p class="blurb">${esc(d.blurb)}</p>
    <div class="tags">${(d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <span class="open">Open demo <span class="arrow">→</span></span>`;
  return a;
}

(async () => {
  let cfg;
  try {
    cfg = await (await fetch('demos.json', { cache: 'no-store' })).json();
  } catch {
    document.getElementById('grid').innerHTML =
      '<div class="empty">Could not load demos.json</div>';
    return;
  }
  document.title = cfg.title || 'Demos';
  document.getElementById('title').textContent = cfg.title || 'Demos';
  document.getElementById('subtitle').textContent = cfg.subtitle || '';
  const grid = document.getElementById('grid');
  const demos = cfg.demos || [];
  if (!demos.length) { grid.innerHTML = '<div class="empty">No demos configured.</div>'; return; }
  demos.forEach(d => grid.appendChild(card(d)));
  document.getElementById('footer').textContent =
    `${demos.length} demo${demos.length === 1 ? '' : 's'} · status refreshes every 30s`;

  async function refresh() {
    for (const d of demos) {
      const up = await checkUp(d);
      const dot = document.getElementById(`s-${d.id}`);
      const txt = document.getElementById(`t-${d.id}`);
      if (!dot) continue;
      dot.className = 'sdot ' + (up ? 'up' : 'down');
      txt.textContent = up ? 'online' : 'offline';
    }
  }
  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
